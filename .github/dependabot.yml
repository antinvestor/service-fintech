version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "auto-merge"
    reviewers:
      - "antinvestor/maintainers"
    assignees:
      - "antinvestor/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # Enable version updates for Flutter/Dart (pub)
  - package-ecosystem: "pub"
    directory: "/app-ui"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-merge"
    reviewers:
      - "antinvestor/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      flutter-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Dart/Flutter UI apps — pub was previously unwatched, which left the
  # jose JWK advisory invisible to dependabot (2026-06 finding).
  - package-ecosystem: "pub"
    directories:
      - "/ui/seed"
      - "/ui/old-implementation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "deps"
      include: "scope"
