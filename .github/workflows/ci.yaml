# Unified CI — handles both Go backend and Flutter UI (auto-detected)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    permissions:
      contents: read
      packages: read
    uses: antinvestor/common/.github/workflows/go-test.yml@main
  lint:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/golangci-lint.yml@main
  flutter:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/flutter-ci.yml@main
    # Pre-existing Dart/Flutter failures surfaced by the per-package
    # flutter-ci (antinvestor/common#41); the jobs stay red, the workflow
    # passes. Remove once they are fixed (see the PR that added this).
    with:
      soft_fail: true
