# Flutter UI CI — every package under ui/ (the composed app plus each library).
name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'sdk/dart/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/flutter-setup/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ui/**'
      - 'sdk/dart/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/flutter-setup/**'

env:
  FLUTTER_VERSION: '3.41.6'

concurrency:
  group: ui-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ui-analyze:
    name: Analyze & Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - identity
          - limits
          - loans
          - savings
          - funding
          - operations
          - seed

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          package-dir: ui/${{ matrix.package }}

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: ui/${{ matrix.package }}

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        working-directory: ui/${{ matrix.package }}

      - name: Run tests
        working-directory: ui/${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ -d test ] && compgen -G 'test/*_test.dart' > /dev/null; then
            flutter test --coverage
          else
            echo "::warning::ui/${{ matrix.package }} has no tests"
          fi

      - name: Upload coverage
        if: hashFiles(format('ui/{0}/coverage/lcov.info', matrix.package)) != ''
        uses: codecov/codecov-action@v7
        with:
          files: ui/${{ matrix.package }}/coverage/lcov.info
          flags: ui-${{ matrix.package }}
        continue-on-error: true

  ui-build:
    name: Build Seed (${{ matrix.target }})
    needs: [ui-analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [web, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          package-dir: ui/seed

      - name: Build web
        if: matrix.target == 'web'
        working-directory: ui/seed
        run: |
          set -euo pipefail
          flutter build web --no-web-resources-cdn
          echo "::notice::Web build size: $(( $(du -sb build/web | cut -f1) / 1024 / 1024 )) MB"

      - name: Build linux
        if: matrix.target == 'linux'
        working-directory: ui/seed
        run: |
          set -euo pipefail
          flutter build linux --debug
          echo "::notice::Linux bundle size: $(( $(du -sb build/linux/x64/debug/bundle | cut -f1) / 1024 / 1024 )) MB"

  ui-summary:
    name: UI CI Summary
    needs: [ui-analyze, ui-build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check results
        run: |
          set -euo pipefail
          {
            echo "## UI CI Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Analyze & Test | ${{ needs.ui-analyze.result }} |"
            echo "| Seed builds | ${{ needs.ui-build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.ui-analyze.result }}" != "success" ] || \
             [ "${{ needs.ui-build.result }}" != "success" ]; then
            echo "::error::One or more required UI checks failed"
            exit 1
          fi
