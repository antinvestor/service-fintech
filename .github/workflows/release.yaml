name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to ship (e.g. v1.96.16). Empty = build from ref.
        required: false
        default: ""
      skip_migrate:
        description: Skip migrate job (emergency image-only)
        type: boolean
        default: false

jobs:
  docker:
    if: github.event_name == 'push' || inputs.tag == ''
    permissions:
      contents: read
      packages: write
    uses: antinvestor/common/.github/workflows/docker-release.yml@main

  buf-push:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/buf-push.yaml@main
    secrets:
      buf_token: ${{ secrets.BUF_TOKEN }}

  # Merge opl/**/*.opl.ts into identity-authorization-keto namespaces.ts (Cloud Run Keto).
  opl-push:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/opl-push.yml@main
    secrets:
      deploy_token: ${{ secrets.DEPLOY_REPO_TOKEN }}

  # Cloud Run apps: identity on stawi-identity; finance-* on stawi-finance.
  ship-identity:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@main
    with:
      image: ghcr.io/antinvestor/service-fintech-identity:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: identity-identity
      migrate_job: identity-identity-migrate
      project_id: stawi-identity
      region: europe-west1
      ship_service_account: cloudrun-ship@stawi-identity.iam.gserviceaccount.com
      workload_identity_provider: projects/721554040672/locations/global/workloadIdentityPools/github/providers/github-ship
      skip_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate == true }}

  ship-finance-funding:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@0b3d2df096df7fb7bff3e91a8dcb12e0094b1a04 # antinvestor/common main
    with:
      image: ghcr.io/antinvestor/service-fintech-funding:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: finance-funding
      allowed_services: finance-funding
      migrate_job: finance-funding-migrate
      project_id: stawi-finance
      region: europe-west1
      ship_service_account: cloudrun-ship@stawi-finance.iam.gserviceaccount.com
      workload_identity_provider: projects/696335580111/locations/global/workloadIdentityPools/github/providers/github-ship
