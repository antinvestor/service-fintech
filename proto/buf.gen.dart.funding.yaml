# Per-module dart codegen for funding. Invoked by proto-generate-dart as:
#   buf generate --template buf.gen.dart.funding.yaml funding
# The positional input scopes generation to this module only.
version: v2
managed:
  enabled: true

plugins:
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../sdk/dart/funding/lib/src
    include_imports: true
    include_wkt: true

  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ../sdk/dart/funding/lib/src
    include_imports: true
    include_wkt: true
