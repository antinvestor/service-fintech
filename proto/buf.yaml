version: v2
modules:
  - path: identity
    name: buf.build/antinvestor/identity
  - path: field
    name: buf.build/antinvestor/field
  - path: loans
    name: buf.build/antinvestor/loans
  - path: savings
    name: buf.build/antinvestor/savings
  - path: funding
    name: buf.build/antinvestor/funding
  - path: operations
    name: buf.build/antinvestor/operations
  - path: limits
    name: buf.build/antinvestor/limits
  # stawi is generated in-repo (gen/go/stawi) and not published to BSR; an
  # unnamed module is skipped by buf push.
  - path: stawi
  # seed is generated in-repo (gen/go/seed) and not published to BSR; an
  # unnamed module is skipped by buf push.
  - path: seed
deps:
  - buf.build/antinvestor/common
  - buf.build/bufbuild/protovalidate
  - buf.build/gnostic/gnostic
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # stawi and seed are permission manifests over an HTTP mux, not served
    # Connect APIs: many routes legitimately share the same loosely typed
    # request/response shapes.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - stawi/stawi/v1/stawi.proto
      - seed/seed/v1/seed.proto
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
