syntax = "proto3";

package field.v1;

// -----------------------------------------------------
// Core notes (normative):
// - Field Service manages agents and clients in the lending hierarchy
// - Agents form a tree hierarchy within branches (configurable max depth)
// - Clients are loan recipients assigned to agents
// - Supports client reassignment with audit trail
// - All timestamps are RFC3339 / google.protobuf.Timestamp
// -----------------------------------------------------

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "common/v1/permissions.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/antinvestor/apis/go/field/v1;fieldv1";
option java_multiple_files = true;
option java_package = "fieldv1";

// -----------------------------------------------------
// Enumerations
// -----------------------------------------------------

// AgentType defines whether an agent is an individual or an organization.
enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0;
  AGENT_TYPE_INDIVIDUAL = 1; // Individual field agent
  AGENT_TYPE_ORGANIZATION = 2; // Organization acting as agent
}

// -----------------------------------------------------
// Entity Messages
// -----------------------------------------------------

// AgentObject represents a field agent in the lending hierarchy.
// Agents can be assigned to multiple branches via AgentBranchObject.
// Deprecated: use identity.v1.WorkforceMemberObject, PositionObject, and InternalTeamObject.
message AgentObject {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string organization_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Organization this agent belongs to
  string parent_agent_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Parent agent in hierarchy (empty for top-level agents)
  string profile_id = 4 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Profile service user ID
  AgentType agent_type = 5; // Individual or organization
  string name = 6 [(buf.validate.field).string.min_len = 1]; // Display name
  string geo_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ]; // Geographic area identifier
  int32 depth = 8; // Depth in the hierarchy tree (0 = top-level)
  common.v1.STATE state = 9; // Current state
  google.protobuf.Struct properties = 10; // Additional metadata
  repeated string branch_ids = 11; // Branch IDs this agent is assigned to (read-only, populated on get/search)
}

// AgentBranchObject links an agent to a branch.
// Supports per-branch properties such as commission structures.
message AgentBranchObject {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string agent_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Agent ID
  string branch_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Branch ID
  common.v1.STATE state = 4; // Active/inactive per assignment
  google.protobuf.Struct properties = 5; // Per-branch metadata (e.g. commission)
}

// ClientObject represents a loan recipient owned by a team.
// Client-to-member relationships are managed via ClientRelationshipObject.
message ClientObject {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string agent_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Deprecated legacy field handler; optional
  string profile_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Profile service user ID; created from the captured phone number when absent
  string name = 4 [(buf.validate.field).string.min_len = 1]; // Display name
  common.v1.STATE state = 5; // Current state
  google.protobuf.Struct properties = 6; // Additional metadata
  string owning_team_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ]; // Canonical owning internal team
  reserved 8; // was primary_relationship_member_id, now in client_relationships table
  // tenant_id and partition_id are where the client is registered (output
  // only). A service acting for the borrower outside a staff request, such
  // as Seed handling a USSD session, works in that partition.
  string tenant_id = 9;
  string partition_id = 10;
}

// ClientRelationshipObject assigns a workforce member to a client.
// Multiple members can be assigned to the same client.
message ClientRelationshipObject {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string client_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string member_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // FK to WorkforceMember
  string name = 4 [(buf.validate.field).string.min_len = 1]; // Human-readable label (e.g. "Loan Officer", "Collections")
  string description = 5; // Details about the relationship
  bool is_primary = 6; // At most one primary per client
  common.v1.STATE state = 7;
  google.protobuf.Struct properties = 8;
}

// -----------------------------------------------------
// Request/Response Messages
// -----------------------------------------------------

// Agent messages
message AgentSaveRequest {
  AgentObject data = 1 [(buf.validate.field).required = true];
}

message AgentSaveResponse {
  AgentObject data = 1;
}

message AgentGetRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
}

message AgentGetResponse {
  AgentObject data = 1;
}

message AgentSearchRequest {
  string query = 1; // Free-text search
  string branch_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Optional filter by branch (via agent_branches join)
  string parent_agent_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Optional filter by parent agent
  common.v1.PageCursor cursor = 4 [(buf.validate.field).cel = {
    id: "cursor.limit_max"
    message: "cursor.limit must be at most 200"
    expression: "this.limit <= 200"
  }]; // Pagination
  string organization_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Optional filter by organization
}

message AgentSearchResponse {
  repeated AgentObject data = 1;
}

// AgentHierarchyRequest retrieves an agent's descendant tree.
message AgentHierarchyRequest {
  string agent_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Root agent ID
  int32 max_depth = 2; // Maximum depth to traverse (0 = unlimited)
}

message AgentHierarchyResponse {
  repeated AgentObject data = 1;
}

// Agent branch assignment messages
message AgentBranchSaveRequest {
  AgentBranchObject data = 1 [(buf.validate.field).required = true];
}

message AgentBranchSaveResponse {
  AgentBranchObject data = 1;
}

message AgentBranchDeleteRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
}

message AgentBranchDeleteResponse {}

message AgentBranchListRequest {
  string agent_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // List branches for an agent
  string branch_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // List agents for a branch
  common.v1.PageCursor cursor = 3 [(buf.validate.field).cel = {
    id: "cursor.limit_max"
    message: "cursor.limit must be at most 200"
    expression: "this.limit <= 200"
  }]; // Pagination
}

message AgentBranchListResponse {
  repeated AgentBranchObject data = 1;
}

// Client messages
message ClientSaveRequest {
  ClientObject data = 1 [(buf.validate.field).required = true];
}

message ClientSaveResponse {
  ClientObject data = 1;
}

message ClientGetRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
}

message ClientGetResponse {
  ClientObject data = 1;
}

message ClientSearchRequest {
  string query = 1; // Free-text search
  string agent_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ]; // Deprecated legacy filter by agent
  common.v1.PageCursor cursor = 3 [(buf.validate.field).cel = {
    id: "cursor.limit_max"
    message: "cursor.limit must be at most 200"
    expression: "this.limit <= 200"
  }]; // Pagination
  string owning_team_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ]; // Optional filter by owning team
  string member_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ]; // Optional filter by relationship handler
  string profile_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ]; // Optional exact filter by the client's profile
}

message ClientSearchResponse {
  repeated ClientObject data = 1;
}

// ClientAccessScopeRequest asks which clients a profile may act for.
message ClientAccessScopeRequest {
  // profile_id is honoured only for internal service callers, which resolve
  // the scope of the end user they are serving. Any other caller always gets
  // their own scope and the field is ignored.
  string profile_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ];
}

// ClientAccessScopeResponse describes the clients a profile may act for.
message ClientAccessScopeResponse {
  // client_id is the client the profile is, when the profile is a borrower.
  string client_id = 1;
  // member_id is the active workforce member the profile is, when any.
  string member_id = 2;
  // served_client_ids are the clients the member's teams own or the member
  // holds an active relationship with. Empty for a borrower.
  repeated string served_client_ids = 3;
}

// ClientReassignRequest moves a client to a different agent.
message ClientReassignRequest {
  string client_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Client to reassign
  string new_agent_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ]; // Target agent
  string reason = 3; // Reason for reassignment
}

message ClientReassignResponse {
  ClientObject data = 1;
}

// ClientOwnershipTransferRequest moves a client from one owning team to another.
message ClientOwnershipTransferRequest {
  string client_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
  string new_owning_team_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string reason = 3;
}

message ClientOwnershipTransferResponse {
  ClientObject data = 1;
}

// --- ClientRelationship ---

message ClientRelationshipSaveRequest {
  ClientRelationshipObject data = 1 [(buf.validate.field).required = true];
}

message ClientRelationshipSaveResponse {
  ClientRelationshipObject data = 1;
}

message ClientRelationshipGetRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "[0-9a-z_-]{3,40}"
  ];
}

message ClientRelationshipGetResponse {
  ClientRelationshipObject data = 1;
}

message ClientRelationshipSearchRequest {
  string client_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ];
  string member_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 40
  ];
  common.v1.PageCursor cursor = 3 [(buf.validate.field).cel = {
    id: "cursor.limit_max"
    message: "cursor.limit must be at most 200"
    expression: "this.limit <= 200"
  }];
}

message ClientRelationshipSearchResponse {
  repeated ClientRelationshipObject data = 1;
}

// -----------------------------------------------------
// Field Service
// -----------------------------------------------------

// FieldService manages agents and clients in the lending hierarchy.
// All RPCs require authentication via Bearer token.
service FieldService {
  option (common.v1.service_permissions) = {
    namespace: "service_field"
    permissions: [
      "agent_view",
      "agent_manage",
      "agent_subagent_manage",
      "client_view",
      "client_manage",
      "client_relationship_view",
      "client_relationship_manage"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "agent_view",
          "agent_manage",
          "agent_subagent_manage",
          "client_view",
          "client_manage",
          "client_relationship_view",
          "client_relationship_manage"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "agent_view",
          "agent_manage",
          "agent_subagent_manage",
          "client_view",
          "client_manage",
          "client_relationship_view",
          "client_relationship_manage"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "agent_view",
          "agent_manage",
          "agent_subagent_manage",
          "client_view",
          "client_manage",
          "client_relationship_view",
          "client_relationship_manage"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: [
          "agent_view",
          "client_view",
          "client_relationship_view"
        ]
      },
      {
        // Field agents hold the member role. They register and serve
        // borrowers inside their own teams; the identity service scopes
        // every client read and write to the teams and relationships the
        // agent holds.
        role: ROLE_MEMBER
        permissions: [
          "agent_view",
          "agent_subagent_manage",
          "client_view",
          "client_manage",
          "client_relationship_view",
          "client_relationship_manage"
        ]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "agent_view",
          "agent_manage",
          "agent_subagent_manage",
          "client_view",
          "client_manage",
          "client_relationship_view",
          "client_relationship_manage"
        ]
      }
    ]
  };

  // AgentSave creates or updates an agent record.
  rpc AgentSave(AgentSaveRequest) returns (AgentSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["agent_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentSave"
      summary: "Create or update an agent"
      description: "Creates a new agent or updates an existing one. When a parent_agent_id is set, the agent inherits the branch from the parent and depth is calculated automatically."
      tags: "Agents"
    };
  }

  // AgentGet retrieves an agent by their ID.
  rpc AgentGet(AgentGetRequest) returns (AgentGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["agent_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentGet"
      summary: "Get an agent by ID"
      description: "Retrieves an agent record by their unique identifier."
      tags: "Agents"
    };
  }

  // AgentSearch finds agents matching search criteria.
  rpc AgentSearch(AgentSearchRequest) returns (stream AgentSearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["agent_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentSearch"
      summary: "Search agents"
      description: "Searches for agents matching specified criteria. Supports filtering by branch and parent agent. Returns a stream of matching agent records."
      tags: "Agents"
    };
  }

  // AgentHierarchy retrieves the descendant tree of an agent.
  rpc AgentHierarchy(AgentHierarchyRequest) returns (stream AgentHierarchyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["agent_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentHierarchy"
      summary: "Get agent hierarchy"
      description: "Retrieves all descendants of the specified agent in the hierarchy tree. Supports limiting the traversal depth."
      tags: "Agents"
    };
  }

  // AgentBranchSave assigns or updates an agent-branch link.
  rpc AgentBranchSave(AgentBranchSaveRequest) returns (AgentBranchSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["agent_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentBranchSave"
      summary: "Assign agent to branch"
      description: "Creates or updates an agent-branch assignment. Supports per-branch properties such as commission structures."
      tags: "Agents"
    };
  }

  // AgentBranchDelete removes an agent-branch link.
  rpc AgentBranchDelete(AgentBranchDeleteRequest) returns (AgentBranchDeleteResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["agent_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentBranchDelete"
      summary: "Remove agent from branch"
      description: "Removes an agent-branch assignment."
      tags: "Agents"
    };
  }

  // AgentBranchList lists agent-branch assignments.
  rpc AgentBranchList(AgentBranchListRequest) returns (stream AgentBranchListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["agent_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "agentBranchList"
      summary: "List agent-branch assignments"
      description: "Lists branch assignments for an agent, or agent assignments for a branch."
      tags: "Agents"
    };
  }

  // ClientSave onboards or updates a client record.
  rpc ClientSave(ClientSaveRequest) returns (ClientSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["client_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientSave"
      summary: "Onboard or update a client"
      description: "Onboards a new client or updates an existing one. Each client must have a unique profile ID and be owned by an internal team."
      tags: "Clients"
    };
  }

  // ClientGet retrieves a client by their ID.
  rpc ClientGet(ClientGetRequest) returns (ClientGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["client_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientGet"
      summary: "Get a client by ID"
      description: "Retrieves a client record by their unique identifier."
      tags: "Clients"
    };
  }

  // ClientSearch finds clients matching search criteria.
  rpc ClientSearch(ClientSearchRequest) returns (stream ClientSearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["client_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientSearch"
      summary: "Search clients"
      description: "Searches for clients matching specified criteria. Supports filtering by owning team and relationship member. Returns a stream of matching client records."
      tags: "Clients"
    };
  }

  // ClientAccessScope reports the clients a profile may act for: its own
  // client as a borrower and the clients it serves as a field agent. Peer
  // services use it to scope their own records to the end user they serve.
  rpc ClientAccessScope(ClientAccessScopeRequest) returns (ClientAccessScopeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["client_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientAccessScope"
      summary: "Resolve the clients a profile may act for"
      description: "Returns the caller's own client, workforce member and served clients. Internal service callers may name the end-user profile to resolve."
      tags: "Clients"
    };
  }

  // ClientReassign moves a client from one agent to another.
  rpc ClientReassign(ClientReassignRequest) returns (ClientReassignResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["client_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientReassign"
      summary: "Reassign a client"
      description: "Deprecated. Client ownership is team-based and should be changed via ClientOwnershipTransfer or ClientRelationshipAssign."
      tags: "Clients"
    };
  }

  rpc ClientOwnershipTransfer(ClientOwnershipTransferRequest) returns (ClientOwnershipTransferResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["client_manage"]
    };
  }

  // ClientRelationshipSave creates or updates a client-member relationship.
  rpc ClientRelationshipSave(ClientRelationshipSaveRequest) returns (ClientRelationshipSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["client_relationship_manage"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientRelationshipSave"
      summary: "Assign a member to a client"
      description: "Creates or updates a relationship between a workforce member and a client."
      tags: "ClientRelationships"
    };
  }

  // ClientRelationshipGet retrieves a client relationship by ID.
  rpc ClientRelationshipGet(ClientRelationshipGetRequest) returns (ClientRelationshipGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["client_relationship_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientRelationshipGet"
      summary: "Get a client relationship"
      description: "Retrieves a client-member relationship by its unique identifier."
      tags: "ClientRelationships"
    };
  }

  // ClientRelationshipSearch finds client relationships matching criteria.
  rpc ClientRelationshipSearch(ClientRelationshipSearchRequest) returns (stream ClientRelationshipSearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["client_relationship_view"]
    };
    option (gnostic.openapi.v3.operation) = {
      operation_id: "clientRelationshipSearch"
      summary: "Search client relationships"
      description: "Searches for client-member relationships by client and/or member."
