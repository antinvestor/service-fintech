syntax = "proto3";
package funding.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "common/v1/money.proto";
import "common/v1/permissions.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/antinvestor/apis/go/funding/v1;fundingv1";
option java_multiple_files = true;
option java_package = "fundingv1";

// InvestorAccountObject represents a pre-funded investor capital account.
message InvestorAccountObject {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string investor_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string account_name = 3 [(buf.validate.field).string.max_len = 200];
  reserved 4;
  common.v1.Money available_balance = 5;
  common.v1.Money reserved_balance = 6;
  common.v1.Money total_deployed = 7;
  common.v1.Money total_returned = 8;
  common.v1.Money max_exposure = 9;
  // Minimum acceptable loan interest rate as a decimal percentage with up to
  // two decimals, e.g. "12.50" for 12.5%. The same shape savings and loans
  // use. Empty means no minimum. A raw basis-point integer is not accepted.
  string min_interest_rate = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"
  ];
  google.protobuf.Struct allowed_products = 11;
  google.protobuf.Struct allowed_regions = 12;
  google.protobuf.Struct group_affiliations = 13;
  common.v1.STATE state = 14;
  google.protobuf.Struct properties = 15;
  // ISO 4217 code the account is denominated in. Explicit so a caller no
  // longer has to smuggle the currency through available_balance on create.
  // When empty, the server falls back to available_balance.currency_code.
  string currency_code = 16 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 3
  ];
}

// FundingAllocationObject represents how a loan is funded across tranches.
message FundingAllocationObject {
  string id = 1;
  string loan_request_id = 2;
  string source_id = 3;
  string source_type = 4;
  int32 tranche_level = 5;
  common.v1.Money amount = 6;
  reserved 7;
  string proportion = 8;
  google.protobuf.Struct properties = 9;
}

message InvestorAccountSaveRequest {
  InvestorAccountObject data = 1;
}
message InvestorAccountSaveResponse {
  InvestorAccountObject data = 1;
}
message InvestorAccountGetRequest {
  string id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
}
message InvestorAccountGetResponse {
  InvestorAccountObject data = 1;
}
message InvestorAccountSearchRequest {
  string investor_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string currency_code = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 3
  ];
  common.v1.PageCursor cursor = 3;
}
message InvestorAccountSearchResponse {
  repeated InvestorAccountObject data = 1;
  // Cursor for the next page; unset when this page is the last.
  common.v1.PageCursor next_cursor = 2;
}

message InvestorDepositRequest {
  string account_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  common.v1.Money amount = 2 [(buf.validate.field).required = true];
  reserved 3;
  // Replay key for this movement. Optional on the wire because the
  // Idempotency-Key header is also honoured; when both are present the
  // header wins. Non-empty values must be at least 8 characters.
  string idempotency_key = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
}
message InvestorDepositResponse {
  InvestorAccountObject data = 1;
}

message InvestorWithdrawRequest {
  string account_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  common.v1.Money amount = 2 [(buf.validate.field).required = true];
  // See InvestorDepositRequest.idempotency_key.
  string idempotency_key = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
}
message InvestorWithdrawResponse {
  InvestorAccountObject data = 1;
}

message FundLoanRequest {
  string loan_request_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
}
message FundLoanResponse {
  repeated FundingAllocationObject allocations = 1;
  common.v1.Money total_allocated = 2;
  common.v1.Money deficit = 3;
  bool fully_funded = 4;
}

// FundingReleaseRequest gives back the capital reserved for a loan that was
// never disbursed.
message FundingReleaseRequest {
  string loan_request_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
}

message FundingReleaseResponse {
  // Capital this call returned to the funders' available balances.
  common.v1.Money released = 1;
}

message AbsorbLossRequest {
  string loan_request_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  common.v1.Money amount = 2 [(buf.validate.field).required = true];
  // Identifies the loss event (write-off reference, default notice id) so a
  // repeated call for the same event absorbs once. Empty keeps the current
  // per-loan idempotency.
  string loss_reference = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 128
  ];
  // Product the loan belongs to. When set, the absorbed loss is also posted
  // to the ledger: each investor's capital and the platform's first-loss
  // reserve take their share of the product's bad-debt expense.
  string product_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
}
message AbsorbLossResponse {
  common.v1.Money absorbed = 1;
  common.v1.Money unrecoverable = 2;
  // True once the ledger postings for the absorbed loss are done (always
  // true when no product_id was given). False means call again with the
  // same loss reference.
  bool settled = 3;
}

// One repayment of a funded loan, to be shared out to the sources that
// funded it in proportion to what each put in.
message LoanRepaymentApplyRequest {
  string loan_request_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  string loan_account_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  // Product whose income account received the interest.
  string product_id = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  // Identifies the repayment. A repeated call with the same reference applies
  // once and finishes any ledger posting an earlier call left undone.
  string repayment_reference = 4 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 128
  ];
  // Principal the repayment cleared. Returned to each funder's capital.
  common.v1.Money principal = 5 [(buf.validate.field).required = true];
  // Interest the repayment paid. Shared to funders net of the platform fee
  // and withholding tax.
  common.v1.Money interest = 6 [(buf.validate.field).required = true];
}

// Principal recovered from a written-off loan, to be returned to the funders
// who absorbed its loss, most senior tranche first.
message LoanRecoveryApplyRequest {
  string loan_request_id = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  // Product whose bad-debt expense the loss was charged against.
  string product_id = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 40
  ];
  // Identifies the recovery. A repeated call with the same reference applies
  // once and finishes any ledger posting an earlier call left undone.
  string recovery_reference = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 128
  ];
  // Principal the borrower paid back after the write-off.
  common.v1.Money principal = 4 [(buf.validate.field).required = true];
}

message LoanRecoveryApplyResponse {
  // Returned to funders. What exceeds the loss they still carry is the
  // lender's recovery income.
  common.v1.Money recovered = 1;
  // True once every ledger posting for this recovery is done.
  bool settled = 2;
}

// One funding source's share of a repayment.
message RepaymentShareObject {
  string source_id = 1;
  string source_type = 2;
  int32 tranche_level = 3;
  common.v1.Money principal = 4;
  common.v1.Money interest = 5;
  common.v1.Money platform_fee = 6;
  common.v1.Money withholding_tax = 7;
}

message LoanRepaymentApplyResponse {
  repeated RepaymentShareObject shares = 1;
  // True once every ledger posting for this repayment is done. False means
  // the shares are recorded but a posting is still owed: call again with the
  // same reference.
  bool settled = 2;
}

service FundingService {
  option (common.v1.service_permissions) = {
    namespace: "service_funding"
    permissions: [
      "investor_account_view",
      "investor_account_manage",
      "fund_manage"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "investor_account_view",
          "investor_account_manage",
          "fund_manage"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "investor_account_view",
          "investor_account_manage",
          "fund_manage"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "investor_account_view",
          "fund_manage"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: ["investor_account_view"]
      },
      {
        role: ROLE_MEMBER
        permissions: ["investor_account_view"]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "investor_account_view",
          "investor_account_manage",
          "fund_manage"
        ]
      }
    ]
  };

  rpc InvestorAccountSave(InvestorAccountSaveRequest) returns (InvestorAccountSaveResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["investor_account_manage"]
    };
  }
  rpc InvestorAccountGet(InvestorAccountGetRequest) returns (InvestorAccountGetResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["investor_account_view"]
    };
  }
  rpc InvestorAccountSearch(InvestorAccountSearchRequest) returns (stream InvestorAccountSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["investor_account_view"]
    };
  }
  rpc InvestorDeposit(InvestorDepositRequest) returns (InvestorDepositResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["investor_account_manage"]
    };
  }
  rpc InvestorWithdraw(InvestorWithdrawRequest) returns (InvestorWithdrawResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["investor_account_manage"]
    };
  }
  rpc FundLoan(FundLoanRequest) returns (FundLoanResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fund_manage"]
    };
  }
  rpc AbsorbLoss(AbsorbLossRequest) returns (AbsorbLossResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fund_manage"]
    };
  }
  // FundingRelease returns the capital reserved for a loan request whose
  // loan was cancelled before disbursement. Repeating it releases nothing
  // more.
  rpc FundingRelease(FundingReleaseRequest) returns (FundingReleaseResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fund_manage"]
    };
  }
  // LoanRepaymentApply shares a loan repayment out to the loan's funders:
  // principal back to their capital, interest net of fee and tax as income.
  rpc LoanRepaymentApply(LoanRepaymentApplyRequest) returns (LoanRepaymentApplyResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fund_manage"]
    };
  }
  // LoanRecoveryApply returns principal recovered from a written-off loan to
  // the funders who absorbed its loss, most senior tranche first.
  rpc LoanRecoveryApply(LoanRecoveryApplyRequest) returns (LoanRecoveryApplyResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["fund_manage"]
    };
  }
}
