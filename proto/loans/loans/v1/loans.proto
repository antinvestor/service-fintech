// --- Portfolio ---

// PortfolioSummary provides aggregate financial metrics across a filtered set of loans.
message PortfolioSummary {
  int32 total_loans = 1;
  int32 active_loans = 2;
  int32 delinquent_loans = 3;
  int32 default_loans = 4;
  int32 paid_off_loans = 5;
  int32 written_off_loans = 6;
  common.v1.Money total_disbursed = 7;
  common.v1.Money total_outstanding = 8;
  common.v1.Money total_collected = 9;
  common.v1.Money principal_outstanding = 10;
  common.v1.Money interest_outstanding = 11;
  common.v1.Money fees_outstanding = 12;
  common.v1.Money penalties_outstanding = 13;
  string currency_code = 14;
  // collection_rate is total_collected / total_disbursed as a percentage string (e.g. "85.50").
  string collection_rate = 15;
  // par_30 is portfolio-at-risk > 30 days as a percentage string (e.g. "12.30").
  string par_30 = 16;
}

message PortfolioSummaryRequest {
  string organization_id = 1;
  string branch_id = 2;
  string agent_id = 3;
  string product_id = 4;
  string client_id = 5;
  string currency_code = 6;
}

message PortfolioSummaryResponse {
  PortfolioSummary data = 1;
}

message PortfolioExportRequest {
  string organization_id = 1;
  string branch_id = 2;
  string agent_id = 3;
  string product_id = 4;
  string client_id = 5;
  string currency_code = 6;
  // format is the export format: "CSV" (default).
  string format = 7;
}

message PortfolioExportResponse {
  bytes data = 1;
  string filename = 2;
  string content_type = 3;
}

