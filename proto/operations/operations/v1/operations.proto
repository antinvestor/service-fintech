syntax = "proto3";
package operations.v1;

import "common/v1/common.proto";
import "common/v1/money.proto";
import "common/v1/permissions.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/antinvestor/apis/go/operations/v1;operationsv1";
option java_multiple_files = true;
option java_package = "operationsv1";

// TransferOrderType classifies a transfer order. The numeric values mirror
// pkg/constants/transfer_types.go exactly so the enum and the legacy int32
// order_type fields describe the same order; the int32 fields remain for
// existing clients and are deprecated.
enum TransferOrderType {
  TRANSFER_ORDER_TYPE_UNSPECIFIED = 0;
  TRANSFER_ORDER_TYPE_PAYMENT = 1;
  TRANSFER_ORDER_TYPE_PAYMENT_IDENTIFIED = 2;
  TRANSFER_ORDER_TYPE_PAYMENT_ALLOCATED = 3;
  TRANSFER_ORDER_TYPE_DISBURSEMENT = 6;
  TRANSFER_ORDER_TYPE_DISBURSEMENT_REVERSAL = 7;
  TRANSFER_ORDER_TYPE_DISBURSEMENT_REVERSAL_REROUTE = 8;
  TRANSFER_ORDER_TYPE_TERMINAL_DISBURSEMENT = 9;
  TRANSFER_ORDER_TYPE_TERMINAL_DISBURSEMENT_RECOVERY = 10;
  TRANSFER_ORDER_TYPE_COST = 11;
  TRANSFER_ORDER_TYPE_SERVICE_FEE = 16;
  TRANSFER_ORDER_TYPE_REGISTRATION_FEE = 21;
  TRANSFER_ORDER_TYPE_PERIODIC_SAVING = 25;
  TRANSFER_ORDER_TYPE_PERIODIC_SAVINGS_INTEREST_INCOME_DISTRIBUTION = 26;
  TRANSFER_ORDER_TYPE_PERIODIC_SAVING_RECOVERY = 27;
  TRANSFER_ORDER_TYPE_PENALTY = 31;
  TRANSFER_ORDER_TYPE_PENALTY_CANCEL = 32;
  TRANSFER_ORDER_TYPE_PENALTY_INCOME_DISTRIBUTION = 33;
  TRANSFER_ORDER_TYPE_LOAN_FUNDING_EXTERNAL_LENDING = 36;
  TRANSFER_ORDER_TYPE_LOAN_FUNDING_EXTERNAL_LENDING_PAYBACK = 37;
  TRANSFER_ORDER_TYPE_INVESTOR_DEPLOYMENT = 38;
  TRANSFER_ORDER_TYPE_INVESTOR_PRINCIPAL_RETURN = 39;
  TRANSFER_ORDER_TYPE_INVESTOR_INCOME_DISTRIBUTION = 40;
  TRANSFER_ORDER_TYPE_LOAN = 41;
  TRANSFER_ORDER_TYPE_LOAN_REPAYMENT = 42;
  TRANSFER_ORDER_TYPE_SHUTDOWN_LOAN_RECOVERY = 43;
  TRANSFER_ORDER_TYPE_PLATFORM_FIRST_LOSS_ABSORPTION = 44;
  TRANSFER_ORDER_TYPE_INVESTOR_LOSS_ABSORPTION = 45;
  TRANSFER_ORDER_TYPE_LOAN_INTEREST = 46;
  TRANSFER_ORDER_TYPE_LOAN_INTEREST_REPAYMENT = 47;
  TRANSFER_ORDER_TYPE_LOAN_INTEREST_INCOME_DISTRIBUTION = 48;
  TRANSFER_ORDER_TYPE_LOAN_INSURANCE = 51;
  TRANSFER_ORDER_TYPE_LOAN_INSURANCE_REPAYMENT = 52;
  TRANSFER_ORDER_TYPE_INTER_SUBSCRIPTION_PAYMENT = 71;
}

message TransferOrderObject {
  string id = 1;
  string debit_account_ref = 2;
  string credit_account_ref = 3;
  common.v1.Money amount = 4;
  reserved 5;
  // Deprecated: use transfer_type. Kept for existing clients; both fields
  // carry the same value.
  int32 order_type = 6 [deprecated = true];
  string reference = 7;
  string description = 8;
  google.protobuf.Struct extra_data = 9;
  common.v1.STATE state = 10;
  TransferOrderType transfer_type = 11;
}

message TransferOrderExecuteRequest {
  TransferOrderObject data = 1;
}
message TransferOrderExecuteResponse {
  TransferOrderObject data = 1;
}

message TransferOrderSearchRequest {
  string query = 1;
  // Deprecated: use transfer_type. When both are set transfer_type wins.
  int32 order_type = 2 [deprecated = true];
  common.v1.PageCursor cursor = 3;
  TransferOrderType transfer_type = 4;
}
message TransferOrderSearchResponse {
  repeated TransferOrderObject data = 1;
  // next_cursor is the opaque cursor for the page after this one; empty on
  // the last page.
  string next_cursor = 2;
}

// IncomingPaymentNotifyRequest notifies the system of a new payment received.
message IncomingPaymentNotifyRequest {
  string transaction_id = 1; // External transaction ID (idempotency key)
  common.v1.Money amount = 2; // Payment amount
  string payer_reference = 3; // Payer reference (phone, account, membership ID)
  string payer_name = 4; // Payer name for fuzzy matching
  string product_id = 5; // Product context
  string group_id = 6; // Group context
  google.protobuf.Struct properties = 7;
}

message IncomingPaymentNotifyResponse {
  string payment_id = 1;
  string status = 2; // "identified" or "unidentified"
  google.protobuf.Struct result = 3;
}

// PaymentAllocateRequest triggers allocation of an identified payment to obligations.
message PaymentAllocateRequest {
  string payment_id = 1;
}

message PaymentAllocateResponse {
  google.protobuf.Struct result = 1;
}

// IncomingPaymentObject is a payment the payment rail received. It carries
// what the payer quoted and who it was matched to, never the payer's phone
// or account: the rail's payer reference stays inside operations.
message IncomingPaymentObject {
  string id = 1;
  // transaction_id is the rail's own id for the payment.
  string transaction_id = 2;
  common.v1.Money amount = 3;
  string payer_name = 4;
  // reference is what the payer quoted, typically a loan account id.
  string reference = 5;
  // product_id is the product whose collection account the rail credited.
  string product_id = 6;
  // matched is true once the payment is tied to a borrower's loan or a
  // group member.
  bool matched = 7;
  string client_id = 8;
  string loan_account_id = 9;
  // identification_strategy says how it was matched; "staff_assigned" when
  // a person tied an unmatched payment to its loan.
  string identification_strategy = 10;
  // unallocated is what is still to be applied; zero once fully allocated.
  common.v1.Money unallocated = 11;
  common.v1.STATE state = 12;
  google.protobuf.Timestamp received_at = 13;
  // assigned_by is the profile that tied the payment to its loan, when a
  // person did.
  string assigned_by = 14;
  string assignment_note = 15;
}

// IncomingPaymentSearchRequest lists received payments, newest first.
message IncomingPaymentSearchRequest {
  // query matches the transaction id, the quoted reference or the payer's
  // name.
  string query = 1;
  // unmatched_only keeps the payments no borrower or member was found for.
  bool unmatched_only = 2;
  string product_id = 3;
  common.v1.PageCursor cursor = 4;
}

message IncomingPaymentSearchResponse {
  repeated IncomingPaymentObject data = 1;
}

// IncomingPaymentAssignRequest ties an unmatched payment to the loan it was
// meant for and allocates it. The amount is the rail's; nobody types one.
// The loan must take repayments and belong to the product the rail credited.
message IncomingPaymentAssignRequest {
  string payment_id = 1;
  string loan_account_id = 2;
  // note says why the payment belongs to this loan; it is kept on the
  // payment for audit.
  string note = 3;
}

message IncomingPaymentAssignResponse {
  IncomingPaymentObject data = 1;
  google.protobuf.Struct allocation = 2;
}

service OperationsService {
  option (common.v1.service_permissions) = {
    namespace: "service_operations"
    permissions: [
      "transfer_execute",
      "transfer_view",
      "payment_notify",
      "payment_allocate",
      "payment_view"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "transfer_execute",
          "transfer_view",
          "payment_notify",
          "payment_allocate",
          "payment_view"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "transfer_execute",
          "transfer_view",
          "payment_notify",
          "payment_allocate",
          "payment_view"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "transfer_execute",
          "transfer_view",
          "payment_notify",
          "payment_allocate",
          "payment_view"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: [
          "transfer_view",
          "payment_view"
        ]
      },
      {
        role: ROLE_MEMBER
        permissions: ["transfer_view"]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "transfer_execute",
          "transfer_view",
          "payment_notify",
          "payment_allocate",
          "payment_view"
        ]
      }
    ]
  };

  rpc TransferOrderExecute(TransferOrderExecuteRequest) returns (TransferOrderExecuteResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transfer_execute"]
    };
  }
  rpc TransferOrderSearch(TransferOrderSearchRequest) returns (stream TransferOrderSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["transfer_view"]
    };
  }
  rpc IncomingPaymentNotify(IncomingPaymentNotifyRequest) returns (IncomingPaymentNotifyResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["payment_notify"]
    };
  }
  rpc PaymentAllocate(PaymentAllocateRequest) returns (PaymentAllocateResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["payment_allocate"]
    };
  }
  // IncomingPaymentSearch lists received payments, for staff to find the
  // ones that matched nobody.
  rpc IncomingPaymentSearch(IncomingPaymentSearchRequest) returns (stream IncomingPaymentSearchResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["payment_view"]
    };
  }
  // IncomingPaymentAssign ties an unmatched payment to its loan and
  // allocates it.
  rpc IncomingPaymentAssign(IncomingPaymentAssignRequest) returns (IncomingPaymentAssignResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["payment_allocate"]
    };
  }
}
