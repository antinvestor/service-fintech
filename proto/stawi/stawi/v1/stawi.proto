syntax = "proto3";

package stawi.v1;

// -----------------------------------------------------
// Core notes (normative):
// - Stawi is the group-lending product. Its runtime surface is the set of
//   workflow callbacks the Trustage engine invokes over plain JSON/HTTP; the
//   service serves them from an http.ServeMux rather than Connect.
// - This file is the permission manifest for that surface. Every HTTP route
//   the mux serves is modelled as an RPC whose google.api.http binding
//   carries the exact method and path, and whose method_permissions names the
//   functional permission the caller must hold in the service_stawi namespace.
// - The Go service registers this descriptor with frame at setup time and
//   enforces the route → permission map on the mux at runtime, so a route
//   that is not in this file fails closed.
// - The RPCs are not served over Connect today; the request/response
//   messages describe the JSON bodies loosely and exist to satisfy the
//   descriptor.
// -----------------------------------------------------

import "common/v1/permissions.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/antinvestor/service-fintech/gen/go/stawi/protocolbuffers/go/stawi/v1;stawiv1";
option java_multiple_files = true;
option java_package = "stawiv1";

// GroupRequest addresses a single group.
message GroupRequest {
  string group_id = 1;
}

// GroupTransitionRequest moves a group to a new state.
message GroupTransitionRequest {
  string group_id = 1;
  int32 state = 2;
  string reason = 3;
}

// GroupPeriodRequest addresses a period within a group.
message GroupPeriodRequest {
  string group_id = 1;
  string period_id = 2;
}

// GroupLoanOfferRequest acts on an accepted loan offer.
// LoanOfferRespondRequest answers a loan offer. response is 1 accept,
// 2 reject; other answers are recorded as given and close the offer.
message LoanOfferRespondRequest {
  string group_id = 1;
  string offer_id = 2;
  int32 response = 3;
}

message GroupLoanOfferRequest {
  string group_id = 1;
  string offer_id = 2;
}

// CallbackResponse is the loosely typed JSON body every callback returns.
message CallbackResponse {
  google.protobuf.Struct data = 1;
}

// StawiWorkflowService is the permission manifest for stawi's workflow
// callback routes. It is registered with frame for OPL generation and
// permission publishing; the routes themselves are served by an
// http.ServeMux in apps/stawi.
service StawiWorkflowService {
  option (common.v1.service_permissions) = {
    namespace: "service_stawi"
    permissions: [
      "stawi_group_view",
      "stawi_group_manage",
      "stawi_tenure_manage",
      "stawi_period_manage",
      "stawi_obligation_manage",
      "stawi_loan_window_manage",
      "stawi_loan_offer_respond",
      "stawi_loan_create"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: [
          "stawi_group_view",
          "stawi_group_manage",
          "stawi_tenure_manage",
          "stawi_period_manage",
          "stawi_obligation_manage",
          "stawi_loan_window_manage",
          "stawi_loan_offer_respond",
          "stawi_loan_create"
        ]
      },
      {
        role: ROLE_ADMIN
        permissions: [
          "stawi_group_view",
          "stawi_group_manage",
          "stawi_tenure_manage",
          "stawi_period_manage",
          "stawi_obligation_manage",
          "stawi_loan_window_manage",
          "stawi_loan_offer_respond",
          "stawi_loan_create"
        ]
      },
      {
        role: ROLE_OPERATOR
        permissions: [
          "stawi_group_view",
          "stawi_group_manage",
          "stawi_tenure_manage",
          "stawi_period_manage",
          "stawi_obligation_manage",
          "stawi_loan_window_manage",
          "stawi_loan_offer_respond",
          "stawi_loan_create"
        ]
      },
      {
        role: ROLE_VIEWER
        permissions: ["stawi_group_view"]
      },
      {
        role: ROLE_MEMBER
        permissions: [
          "stawi_loan_offer_respond",
          "stawi_group_view"
        ]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "stawi_group_view",
          "stawi_group_manage",
          "stawi_tenure_manage",
          "stawi_period_manage",
          "stawi_obligation_manage",
          "stawi_loan_window_manage",
          "stawi_loan_offer_respond",
          "stawi_loan_create"
        ]
      }
    ]
  };

  // --- Group lifecycle ---

  rpc GroupCheckFormation(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/check-formation"
      body: "*"
    };
  }
  rpc GroupSetupLedger(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/setup-ledger"
      body: "*"
    };
  }
  rpc GroupRegisterLender(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/register-lender"
      body: "*"
    };
  }
  rpc GroupWelcome(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/welcome"
      body: "*"
    };
  }
  rpc GroupTransition(GroupTransitionRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/transition"
      body: "*"
    };
  }
  rpc GroupMembersList(GroupRequest) returns (CallbackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.method_permissions) = {
      permissions: ["stawi_group_view"]
    };
    option (google.api.http) = {get: "/api/v1/groups/{group_id}/members"};
  }

  // --- Tenure and period lifecycle ---

  rpc TenureOpen(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_tenure_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/create-tenure"
      body: "*"
    };
  }
  rpc PeriodOpen(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_period_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/open-period"
      body: "*"
    };
  }
  rpc PeriodClose(GroupPeriodRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_period_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/periods/{period_id}/close"
      body: "*"
    };
  }
  rpc PeriodFreeze(GroupPeriodRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_period_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/periods/{period_id}/freeze"
      body: "*"
    };
  }
  rpc PeriodExtend(GroupPeriodRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_period_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/periods/{period_id}/extend"
      body: "*"
    };
  }

  // --- Obligations ---

  // ObligationCalculate raises the period's savings obligation for every
  // member in operations, which applies money they already paid. Calling it
  // again raises nothing new and reports who still owes.
  rpc ObligationCalculate(GroupPeriodRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_obligation_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/periods/{period_id}/calculate-obligations"
      body: "*"
    };
  }
  // ObligationReconcilePeriod closes the period's obligations in operations:
  // each member still owing is fined once, and the statement is returned.
  rpc ObligationReconcilePeriod(GroupPeriodRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_obligation_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/periods/{period_id}/reconcile"
      body: "*"
    };
  }

  // --- Loan windows and offers ---

  rpc LoanWindowEvaluate(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_loan_window_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/evaluate-loan-window"
      body: "*"
    };
  }
  rpc LoanWindowOpen(GroupRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_loan_window_manage"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/loan-window/open"
      body: "*"
    };
  }
  // LoanOfferRespond records a member's answer to a loan offer. A member
  // answers only their own offers; staff and services may answer any.
  rpc LoanOfferRespond(LoanOfferRespondRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_loan_offer_respond"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/loan-offers/{offer_id}/respond"
      body: "*"
    };
  }
  rpc LoanAccountCreate(GroupLoanOfferRequest) returns (CallbackResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_loan_create"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/loans"
      body: "*"
    };
  }
}
