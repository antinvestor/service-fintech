syntax = "proto3";

package stawi.v1;

// -----------------------------------------------------
// Core notes (normative):
// - Stawi is the group (SACCO/chama) savings and lending product. Its
//   periodic work - setting up groups, closing due periods, reminding
//   members, finishing loan offers - runs only when the platform scheduler
//   (trustage) calls StawiJobRun; nothing in the service runs on a timer.
// - StawiService is served over Connect. LoanOfferRespond is also served as
//   a plain JSON route for members' apps; its google.api.http binding names
//   that route, and the service enforces the route -> permission map from
//   this file, so a route that is not here fails closed.
// - Every permission lives in the service_stawi namespace.
// -----------------------------------------------------

import "buf/validate/validate.proto";
import "common/v1/permissions.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/antinvestor/service-fintech/gen/go/stawi/protocolbuffers/go/stawi/v1;stawiv1";
option java_multiple_files = true;
option java_package = "stawiv1";

// StawiJob is a periodic job the platform scheduler runs.
enum StawiJob {
  STAWI_JOB_UNSPECIFIED = 0;
  // Sets up groups identity holds active (ledger accounts, lender
  // registration, tenure, first period, its obligations, a welcome), and
  // stops new periods for groups identity shut down or deactivated.
  STAWI_JOB_GROUP_LIFECYCLE = 1;
  // Closes periods whose end date has passed: late fines in operations,
  // the next period and its obligations, the loan window, and each
  // member's period summary.
  STAWI_JOB_CLOSE_DUE_PERIODS = 2;
  // Reminds members still owing a period's savings at fixed offsets before
  // it ends, once per offset, and tells the group's leaders who is behind.
  STAWI_JOB_SEND_REMINDERS = 3;
  // Finishes accepted offers whose loan is not paid yet, closes offers
  // nobody answered in time, and retries cancelling the loans of offers
  // that could not be paid.
  STAWI_JOB_LOAN_OFFERS = 4;
}

message StawiJobRunRequest {
  StawiJob job = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Most items to process in this run. 0 uses the service default.
  int32 batch_size = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 5000
  ];
}

message StawiJobRunResponse {
  int32 processed = 1;
  // True when the batch was full and more work may be waiting.
  bool more = 2;
}

// LoanOfferRespondRequest answers a loan offer. response is 1 accept,
// 2 reject; other answers are recorded as given and close the offer.
message LoanOfferRespondRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
  string offer_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 response = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5
  }];
}

// LoanOfferRespondResponse reports the offer after the answer: an accepted
// offer whose loan is still being made reads origination_status "pending".
message LoanOfferRespondResponse {
  google.protobuf.Struct data = 1;
}

// StawiService is stawi's API and the permission manifest of the
// service_stawi namespace.
service StawiService {
  option (common.v1.service_permissions) = {
    namespace: "service_stawi"
    permissions: [
      "stawi_loan_offer_respond",
      "stawi_job_run"
    ]
    role_bindings: [
      {
        role: ROLE_OWNER
        permissions: ["stawi_loan_offer_respond"]
      },
      {
        role: ROLE_ADMIN
        permissions: ["stawi_loan_offer_respond"]
      },
      {
        role: ROLE_OPERATOR
        permissions: ["stawi_loan_offer_respond"]
      },
      {
        role: ROLE_MEMBER
        permissions: ["stawi_loan_offer_respond"]
      },
      {
        role: ROLE_SERVICE
        permissions: [
          "stawi_loan_offer_respond",
          "stawi_job_run"
        ]
      }
    ]
  };

  // LoanOfferRespond records a member's answer to a loan offer. A member
  // answers only their own offers; staff and services may answer any.
  rpc LoanOfferRespond(LoanOfferRespondRequest) returns (LoanOfferRespondResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_loan_offer_respond"]
    };
    option (google.api.http) = {
      post: "/api/v1/groups/{group_id}/loan-offers/{offer_id}/respond"
      body: "*"
    };
  }

  // StawiJobRun runs one batch of a periodic job. Called by the platform
  // scheduler (trustage); nothing in the service runs on a timer.
  rpc StawiJobRun(StawiJobRunRequest) returns (StawiJobRunResponse) {
    option (common.v1.method_permissions) = {
      permissions: ["stawi_job_run"]
    };
  }
}
