name: antinvestor_ui_limits
description: >
  Limits management UI library for Antinvestor. Embeddable screens and widgets
  for policy CRUD, approval workflow, ledger search, and the audit-on-limiting
  feed.
version: 0.2.0
publish_to: none
repository: https://github.com/antinvestor/service-fintech
homepage: https://github.com/antinvestor/service-fintech/tree/main/ui/limits
issue_tracker: https://github.com/antinvestor/service-fintech/issues
topics:
  - flutter
  - ui
  - limits
  - antinvestor
  - admin

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  antinvestor_ui_core: ^0.6.0
  antinvestor_api_limits:
    path: ../../sdk/dart/limits
  antinvestor_api_common: ^2.0.0
  connectrpc: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
