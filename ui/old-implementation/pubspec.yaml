name: lender_ui
description: "AntInvestor Lender - Loan management platform for banks, agents, and field operations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  app_links: ^7.2.1
  antinvestor_api_common: ^1.53.1
  antinvestor_api_geolocation: ^0.1.0
  antinvestor_api_profile: ^1.52.0
  antinvestor_api_notification: ^1.51.0
  antinvestor_api_tenancy: ^1.54.0
  connectivity_plus: ^7.3.1
  antinvestor_ui_core: ^0.2.0
  antinvestor_ui_identity: ^0.1.0
  antinvestor_ui_loans: ^0.1.0
  antinvestor_ui_savings: ^0.1.0
  antinvestor_ui_funding: ^0.1.0
  antinvestor_ui_operations: ^0.1.0
  connectrpc: ^1.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fixnum: ^1.1.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  openid_client: ^0.4.10
  protobuf: ^4.2.0
  riverpod_annotation: ^4.0.6
  url_launcher: ^6.3.2
  logger: ^2.7.0
  web: ^1.1.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

dependency_overrides:
  # Security floor: see ui/seed/pubspec.yaml — jose <=0.3.5 JWK advisory.
  jose: '>=0.3.5+1'
