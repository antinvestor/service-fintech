name: seed_ui
description: "Seed - Direct-to-client lending product by Antinvestor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  antinvestor_ui_core: ^0.6.0
  antinvestor_ui_audit: ^0.4.0
  antinvestor_ui_identity:
    path: ../identity
  antinvestor_ui_limits:
    path: ../limits
  antinvestor_ui_loans:
    path: ../loans
  antinvestor_ui_funding:
    path: ../funding
  antinvestor_ui_operations:
    path: ../operations
  antinvestor_ui_profile: ^0.3.0
  antinvestor_ui_geolocation: ^0.3.0
  antinvestor_api_common: ^2.0.0
  # Direct constraint, not an override: GHSA jose <=0.3.5 accepts untrusted
  # JWK header keys during signature verification, fixed in 0.3.5+1. Stated
  # here (rather than in dependency_overrides) so a local
  # pubspec_overrides.yaml, which replaces the override block wholesale,
  # cannot drop the security floor.
  jose: '>=0.3.5+1'

  antinvestor_api_files: ^2.0.0
  connectrpc: ^2.0.0
  fixnum: ^1.1.1
  image_picker: ^1.1.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  openid_client: ^0.4.10
  protobuf: ^6.1.0
  logger: ^2.7.0
  web: ^1.1.1
  app_links: ^7.0.0
  riverpod_annotation: ^4.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  antinvestor_api_loans: ^0.6.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0

# antinvestor_api_identity 0.5.x is not on pub.dev yet, so every package that
# depends on it resolves against the generated SDK in this repo. That override
# lives in the gitignored pubspec_overrides.yaml (CI writes one) because a
# path dependency cannot be published. See README.md.

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
